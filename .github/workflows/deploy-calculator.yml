name: Deploy OIBSIP Projects

on:
  push:
    branches: ["main"]
    paths:
      - "WebDev-L2-Calculator/**"
      - "WebDev-L2-ToDo-App/**"
      - ".github/workflows/deploy-calculator.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        run: |
          mkdir -p public/todo
          cp -r WebDev-L2-Calculator/. public/
          cp -r WebDev-L2-ToDo-App/. public/todo/

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4